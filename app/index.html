<style>
/* Layout: one card — name headers with color dots, kg cells, a dark totals band, and a toolbar footer. */
:root {
  --bg: #f4f5f6;
  --card: #ffffff;
  --ink: #16191c;
  --muted: #8b9196;
  --line: #e6e8ea;
  --field-line: #e1e4e7;
  --focus-bg: #fffbea;
  --band: #121314;
  --band-line: #26282a;
  --band-ink: #ffffff;
  --band-muted: #a3a8ad;
  --grand: #1fd17a;
  --key: #1d1f22;
  --key-hover: #33373c;
  --sans: "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1112; --card: #181a1c; --ink: #eceef0; --muted: #868c92;
    --line: #26292c; --field-line: #2f3236; --focus-bg: #2a2716;
    --band: #0a0b0c; --band-line: #222426; --key: #2c3035; --key-hover: #3d4248; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1112; --card: #181a1c; --ink: #eceef0; --muted: #868c92;
  --line: #26292c; --field-line: #2f3236; --focus-bg: #2a2716;
  --band: #0a0b0c; --band-line: #222426; --key: #2c3035; --key-hover: #3d4248; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: max-content; table-layout: fixed; }
th, td { padding: 0; width: 120px; min-width: 108px; }
td + td, th + th { border-left: 1px solid var(--line); }

thead th { text-align: left; padding: 8px 8px 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.head { display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c); }
.name { flex: 1; min-width: 0; border: 1px solid var(--field-line); border-radius: 6px; background: var(--card); color: var(--ink); font: 700 0.9rem var(--sans); padding: 4px 6px; }
.name::placeholder { color: var(--muted); font-weight: 500; }
.trash { border: 0; background: transparent; color: var(--muted); padding: 2px; cursor: pointer; display: grid; place-items: center; border-radius: 4px; }
.trash:hover { color: #d94040; }
.trash svg { width: 14px; height: 14px; }
.col { font: 600 0.68rem var(--mono); color: var(--muted); margin: 6px 0 0 16px; letter-spacing: 0.04em; }

tbody td { padding: 6px; border-bottom: 1px solid var(--line); }
.cell { position: relative; }
.num { width: 100%; border: 1px solid var(--field-line); border-radius: 6px; background: var(--card); color: var(--ink); font: 400 0.82rem var(--mono); text-align: right; padding: 8px 10px 8px 8px; font-variant-numeric: tabular-nums; }
.num::placeholder { color: var(--muted); opacity: .7; }
.num:focus { outline: none; border: 2px solid var(--ink); padding: 7px 9px 7px 7px; background: var(--focus-bg); }
.num.bad { border-color: #d94040; color: #d94040; }
.unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font: 400 0.68rem var(--mono); color: var(--muted); pointer-events: none; }

tfoot td { background: var(--band); color: var(--band-ink); }
tfoot td + td { border-left-color: var(--band-line); }
.tot { padding: 10px 6px 8px; text-align: right; border-bottom: 1px solid var(--band-line); }
.tot .lbl { font: 700 0.66rem var(--sans); letter-spacing: 0.05em; color: var(--band-muted); }
.tot .val { display: flex; align-items: center; justify-content: flex-end; gap: 5px; font: 700 0.86rem var(--mono); margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tot .val .dot { width: 7px; height: 7px; }
.tot .meta { display: flex; justify-content: space-between; font: 400 0.62rem var(--mono); color: var(--band-muted); margin-top: 8px; }
.grand { text-align: center; padding: 18px 12px; }
.grand span { font: 700 0.8rem var(--sans); letter-spacing: 0.06em; color: var(--band-muted); vertical-align: middle; margin-right: 10px; }
.grand strong { font: 700 1.5rem var(--mono); color: var(--grand); vertical-align: middle; font-variant-numeric: tabular-nums; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.btn { font: 600 0.85rem var(--sans); border: 1px solid var(--field-line); background: var(--card); color: var(--ink); border-radius: 7px; padding: 6px 12px; cursor: pointer; box-shadow: 0 1px 0 var(--line); }
.btn:hover { border-color: var(--muted); }
.ghost { font: 500 0.85rem var(--sans); border: 0; background: transparent; color: var(--muted); padding: 6px 8px; cursor: pointer; }
.ghost:hover { color: var(--ink); }
.ghost.armed { color: #d94040; }
.unitbox { margin-left: auto; display: flex; align-items: center; gap: 6px; font: 400 0.75rem var(--mono); color: var(--muted); }
.unitbox input { width: 52px; font: 700 0.75rem var(--mono); color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 3px 4px; }
.unitbox input:hover, .unitbox input:focus { border-color: var(--field-line); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; justify-items: center; }
.layout > .card { width: 100%; }
.pad { background: #1b1c1f; border: 1px solid #2a2c30; border-radius: 18px; padding: 22px; display: grid; gap: 14px; max-width: 100%; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.pad-target { font: 600 0.85rem var(--mono); color: #8e949b; letter-spacing: 0.04em; text-align: center; min-height: 1em; }
.keys { display: grid; grid-template-columns: repeat(3, 116px); gap: 14px; }
.key { height: 76px; border: 1px solid #34363b; border-radius: 12px; background: #26272b; color: #ffffff; font: 700 1.7rem var(--sans); cursor: pointer; display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 0 rgba(0,0,0,.35); transition: transform .05s, background .1s; }
.key:hover { background: #303237; }
.key:active { transform: translateY(1px); background: #383a40; }
.key.clear { color: #ff5c6c; font-size: 1.4rem; }
.key.plus { color: #ffb020; }
.key.back svg { width: 28px; height: 28px; }
.key.eq { background: #0f9e68; border-color: #0f9e68; box-shadow: 0 3px 0 #0a7049; }
.key.eq:hover { background: #12b076; }
.key.eq:active { background: #0c8a5a; }
@media (max-width: 460px) { .pad { padding: 16px; width: 100%; } .keys { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } .key { height: 64px; } }
@media (prefers-reduced-motion: reduce) { .key { transition: none; } }
/* Phones: keypad stays pinned at the bottom of the screen and the phone keyboard stays hidden. */
@media (max-width: 700px), (pointer: coarse) and (max-width: 1000px) {
  .wrap { padding-block: 12px 0; }
  .pad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; width: 100%; max-width: none; margin: 0; border-radius: 16px 16px 0 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 8px; box-shadow: 0 -6px 20px rgba(0,0,0,.25); }
  .keys { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .key { height: 54px; font-size: 1.45rem; }
  .pad-target { font-size: 0.78rem; }
  .grand { text-align: left; padding-left: 14px; }
}
.pad { transition: transform .22s ease; }
.pad.dragging { transition: none; }
.pad-handle { justify-self: stretch; display: grid; justify-items: center; gap: 6px; margin: -12px 0 -6px; padding: 8px 0 6px; background: transparent; border: 0; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
.pad-handle:active { cursor: grabbing; }
.pad-handle .grip { width: 48px; height: 5px; border-radius: 3px; background: #6b7078; }
.pad-handle:hover .grip { background: #8e949b; }
.pad-hint { display: none; font: 600 0.8rem var(--sans); color: #c9cdd2; letter-spacing: 0.02em; }
.pad.closed { gap: 0; padding-block: 12px 10px; }
.pad.closed .pad-target, .pad.closed .keys { display: none; }
.pad.closed .pad-hint { display: block; }
.pad.closed .pad-handle { margin: 0; padding: 2px 24px; }
@media (prefers-reduced-motion: reduce) { .pad { transition: none; } }
/* ---- Day bar, notes and archive ---- */
.daybar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.daybar input[type="date"] { font: 600 0.95rem var(--sans); color: var(--ink); background: var(--card); border: 1px solid var(--field-line); border-radius: 7px; padding: 6px 8px; min-height: 36px; }
.note-box { flex: 1 1 90px; min-width: 0; max-width: 340px; font: 400 16px var(--sans); color: var(--ink); background: var(--card); border: 1px solid var(--field-line); border-radius: 8px; padding: 7px 10px; min-height: 36px; }
.note-box:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
.readonly .note-box { opacity: .65; }
.daybar .step { width: 36px; height: 36px; padding: 0; font-size: 1.2rem; line-height: 1; }
.daymeta { margin-left: auto; font: 400 0.75rem var(--mono); color: var(--muted); }
.notice { margin: 0; padding: 8px 12px; font-size: 0.85rem; border-bottom: 1px solid var(--line); background: var(--focus-bg); color: var(--ink); }
.notice.err { background: #fde8e8; color: #9b1c1c; }
.readonly .num, .readonly .name { pointer-events: none; opacity: .65; }
.readonly .bar button, .readonly .trash { visibility: hidden; }
.archive:not(.reveal) { display: none; }   /* the Archive opens from the history list */
.archive { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.archive > summary { cursor: pointer; padding: 12px 14px; font: 700 0.9rem var(--sans); list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.archive > summary::-webkit-details-marker { display: none; }
.archive > summary span { font: 400 0.75rem var(--mono); color: var(--muted); }
.archive-body { display: grid; gap: 10px; padding: 0 14px 14px; }
.arch-list { display: grid; gap: 6px; max-height: 260px; overflow: auto; margin: 0; padding: 0; list-style: none; }
.arch-list li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.85rem; }
.arch-list .d { font: 600 0.82rem var(--mono); }
.arch-list .n { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.arch-list .t { font: 600 0.82rem var(--mono); }
.arch-list button { all: unset; cursor: pointer; display: contents; }
.arch-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.export-out { width: 100%; min-height: 110px; font: 400 0.72rem var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--field-line); border-radius: 8px; padding: 8px; }
.arch-status { margin: 0; font: 400 0.75rem var(--mono); color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* ---- Phones: fit five columns on one screen ---- */
@media (max-width: 700px) {
  .wrap { padding-inline: 8px; }
  #grid { table-layout: fixed; min-width: 0; width: max(100%, calc(var(--cols, 5) * 20%)); }
  #grid th, #grid td { width: auto; min-width: 0; }
  #grid thead th { padding: 6px 3px; }
  #grid .head { flex-wrap: wrap; gap: 4px; }
  #grid .head .name { order: 1; flex: 1 1 100%; width: 100%; font-size: 0.78rem; padding: 4px 3px; }
  #grid .head .dot { order: 2; margin-left: 3px; }
  #grid .head .trash { order: 3; margin-left: auto; padding: 0; }
  #grid .head .trash svg { width: 13px; height: 13px; }
  #grid .col { display: none; }
  #grid tbody td { padding: 3px; }
  #grid .num { font-size: 0.85rem; padding: 7px 4px; }
  #grid .num:focus { padding: 6px 3px; }
  #grid .tot { padding: 6px 3px; }
  #grid .tot .lbl { font-size: 0.55rem; }
  #grid .tot .val { font-size: 0.72rem; gap: 3px; }
  #grid .tot .val .dot { display: none; }
  #grid .tot .u { display: none; }
  #grid .tot .meta { flex-direction: column; align-items: flex-end; gap: 1px; font-size: 0.56rem; margin-top: 4px; }
  #grid .grand strong { font-size: 1.3rem; }
}
@media (max-width: 360px) {
  #grid .num { font-size: 0.74rem; padding: 7px 2px; }
  #grid .num:focus { padding: 6px 1px; }
  #grid .tot .val { font-size: 0.62rem; }
  #grid .tot .meta { font-size: 0.5rem; }
}
/* ---- History button + last-30-days sheet ---- */
.hist-btn { margin-left: auto; position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--field-line); border-radius: 10px; background: var(--card); color: var(--ink); cursor: pointer; }
.hist-btn:hover { border-color: var(--muted); }
.new-btn { color: #0f9e68; }
.calc-btn { margin-left: auto; }
.new-btn + .hist-btn { margin-left: 0; }
.hist-btn svg { width: 22px; height: 22px; }
.hist-badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #0f9e68; color: #fff; font: 700 0.66rem/18px var(--sans); text-align: center; }
.hist-overlay { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.hist-sheet { width: min(560px, 100%); max-height: 82vh; display: flex; flex-direction: column; background: var(--card); color: var(--ink); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.3); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 701px) { .hist-overlay { align-items: center; } .hist-sheet { border-radius: 16px; } }
.hist-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.hist-head h2 { margin: 0; font: 700 1.05rem var(--sans); }
.hist-head p { margin: 2px 0 0; font: 400 0.75rem var(--sans); color: var(--muted); }
.hist-close { margin-left: auto; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 1.4rem; cursor: pointer; }
.hist-close:hover { color: var(--ink); background: var(--bg); }
.hist-list { list-style: none; margin: 0; padding: 8px 12px 12px; overflow: auto; display: grid; gap: 6px; }
.hist-item { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); cursor: pointer; font: inherit; }
.hist-item:hover { border-color: var(--muted); }
.hist-item.current { border-color: #0f9e68; box-shadow: inset 3px 0 0 #0f9e68; }
.hist-item .hd { font: 700 0.9rem var(--sans); }
.hist-item .ht { font: 700 0.9rem var(--mono); text-align: right; }
.hist-item .hn { font-size: 0.8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hist-item .hl { font: 400 0.7rem var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
.hist-item .hl.soon { color: #d97706; }
.hist-empty { padding: 18px 4px; color: var(--muted); font-size: 0.9rem; text-align: center; }
.hist-foot { padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--muted); }
.hist-foot button { all: unset; cursor: pointer; color: var(--ink); font-weight: 700; text-decoration: underline; }
.hist-snap { margin: 4px 0 0 14px; }
.hist-snap .hist-item { padding: 8px 12px; border-style: dashed; }
.hist-snap .hd { font-weight: 600; font-size: 0.84rem; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; background: #0f9e68; color: #fff; font: 600 0.88rem var(--sans); padding: 9px 16px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
/* ---- Press and hold to delete ---- */
.hist-item { position: relative; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.hist-item::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: #e5484d; }
.hist-item.holding::after { width: 100%; transition: width 3s linear; }
.hist-item.holding { background: color-mix(in srgb, #e5484d 8%, var(--card)); }
.hist-tip { margin: 0; padding: 0 16px 10px; font: 400 0.72rem var(--sans); color: var(--muted); }
.confirm-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 16px; }
.confirm-box { width: min(360px, 100%); background: var(--card); color: var(--ink); border-radius: 14px; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.35); display: grid; gap: 10px; }
.confirm-box h3 { margin: 0; font: 700 1.05rem var(--sans); }
.confirm-box p { margin: 0; font-size: 0.9rem; color: var(--muted); }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.btn-danger { font: 700 0.9rem var(--sans); border: 0; border-radius: 8px; padding: 9px 16px; background: #e5484d; color: #fff; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .hist-item.holding::after { transition: none; } }
/* ---- Full calculator under the table ---- */
.calc { width: 100%; max-width: 480px; justify-self: center; background: #000; color: #fff; border-radius: 22px; padding: 12px 14px 14px; display: grid; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.calc-head { display: flex; align-items: center; justify-content: space-between; }
.calc-head h2 { margin: 0; font: 700 0.95rem var(--sans); color: #d6d6d6; }
.calc-head small { font: 400 0.72rem var(--sans); color: #8e8e93; }
.calc-tape { list-style: none; margin: 0; padding: 0 2px 0 0; height: clamp(84px, 17vh, 150px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; text-align: right; font: 500 1.05rem/1.25 var(--sans); overflow-wrap: anywhere; }
/* scroll by swiping, without a visible scrollbar */
.calc-tape, .hist-list { scrollbar-width: none; -ms-overflow-style: none; }
.calc-tape::-webkit-scrollbar, .hist-list::-webkit-scrollbar { display: none; width: 0; height: 0; }
.calc-tape li:first-child { margin-top: auto; }   /* newest entries sit at the bottom, older ones scroll up */
.calc-tape li { flex: none; }
.calc-tape li button { all: unset; cursor: pointer; display: block; width: 100%; }
.calc-tape .ex { color: #8e8e93; }
.calc-tape .rs { color: #fff; }
.calc-tape .empty { color: #636366; font-size: 0.85rem; }
.calc-expr { min-height: 1.3em; text-align: right; color: #8e8e93; font: 500 1rem var(--sans); overflow-wrap: anywhere; }
.calc-display { text-align: right; font: 300 clamp(2rem, 9vw, 3rem)/1.05 var(--sans); letter-spacing: -0.02em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.calc-keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
.ck { border: 0; border-radius: 999px; height: clamp(46px, 7.4vh, 62px); min-height: 0; font: 400 clamp(1.4rem, 6vw, 2rem) var(--sans); cursor: pointer; display: grid; place-items: center; touch-action: manipulation; -webkit-user-select: none; user-select: none; transition: filter .08s; }
.ck:active { filter: brightness(1.35); }
.ck.dg { background: #fff; color: #000; font-size: clamp(1.7rem, 8vw, 2.5rem); }
.ck.fn { background: #333336; color: #fff; font-size: clamp(1.1rem, 5vw, 1.6rem); }
.ck.op { background: #f19a0e; color: #fff; font-size: clamp(1.6rem, 7vw, 2.3rem); }
.ck.op.on { background: #fff; color: #f19a0e; }
.ck.zero { grid-column: span 2; aspect-ratio: auto; justify-items: start; padding-left: 12%; }
.ck.eq { grid-row: span 2; height: auto; background: #f19a0e; color: #fff; font-size: clamp(1.8rem, 8vw, 2.6rem); }
.ck svg { width: 46%; height: 46%; }
.ck.fn svg { color: #d1d1d6; }
.calc.hide-tape .calc-tape { visibility: hidden; }   /* keep the same height */
/* Calculator opens as a sheet from its button */
.calc { display: none; }
.calc.open { display: grid; position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; margin: 0 auto; max-height: 100%; overflow-y: auto; border-radius: 22px 22px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.calc.open { max-height: 88vh; box-shadow: 0 -8px 24px rgba(0,0,0,.3); }
.calc-backdrop { position: fixed; inset: 0; z-index: 34; background: rgba(0,0,0,.5); }
.calc-close { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #333336; color: #fff; font-size: 1.3rem; line-height: 1; cursor: pointer; }
.calc-btn { color: #f19a0e; }

<script>
/* =====================================================================================
   FarmStore — on-device storage for day records, with a 30-day "archive before delete"
   retention pipeline. Everything lives in this phone's storage (works offline).

   Storage keys (localStorage):
     farm-days-v1     active days, keyed by date      { schema, days: { "YYYY-MM-DD": Day } }
     farm-archive-v1  archived days, keyed by date    { schema, records: { "YYYY-MM-DD": ArchivedDay } }
     farm-meta-v1     bookkeeping                     { lastRetentionRun, lastArchived, migratedLegacy }

   Day          = { date, names[], rows[][], unit, notes, createdAt, updatedAt, saved[] }   (ISO timestamps)
   saved[]      = earlier pages of the day (New page or Clear): { savedAt, via: "new"|"clear", names[], rows[][], unit, notes }
   ArchivedDay  = Day + { archivedAt, checksum }
   ===================================================================================== */
const FarmStore = (() => {
  const DAYS_KEY = "farm-days-v1", ARCHIVE_KEY = "farm-archive-v1", META_KEY = "farm-meta-v1";
  const LEGACY_KEY = "name-tally-v2";           // single-sheet data from the first app version
  const SCHEMA = 1;
  const RETENTION_DAYS = 30;

  /* ---- dates: always the phone's local calendar day, as YYYY-MM-DD ---- */
  const pad2 = n => String(n).padStart(2, "0");
  const isoDate = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  // All dates follow Cambodia time (Asia/Phnom_Penh, UTC+7, no daylight saving), whatever the phone is set to.
  const KH_OFFSET_MS = 7 * 60 * 60 * 1000;
  const today = () => { const d = new Date(Date.now() + KH_OFFSET_MS); return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate()); };
  const isValidDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && isoDate(new Date(s + "T12:00:00")) === s;
  function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoDate(d); }
  /** Oldest date that is still "active". Anything strictly older gets archived. */
  const cutoffDate = (now = today()) => addDays(now, -RETENTION_DAYS);

  /* ---- raw storage: reads throw on corrupt data so we never overwrite what we cannot read ---- */
  function readJSON(key, fallback) {
    const raw = localStorage.getItem(key);
    if (raw == null) return fallback;
    return JSON.parse(raw);
  }
  const writeJSON = (key, value) => localStorage.setItem(key, JSON.stringify(value));

  /** Stable fingerprint of a day's content (FNV-1a), used to prove the archive copy matches. */
  function checksum(day) {
    const s = JSON.stringify([day.date, day.names, day.rows, day.unit, day.notes, day.updatedAt, day.saved || []]);
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, "0");
  }

  function loadDays() {
    const store = readJSON(DAYS_KEY, { schema: SCHEMA, days: {} });
    if (!store || typeof store.days !== "object") throw new Error("Saved days are unreadable");
    return store;
  }
  function loadArchive() {
    const a = readJSON(ARCHIVE_KEY, { schema: SCHEMA, records: {} });
    if (!a || typeof a.records !== "object") throw new Error("Archive is unreadable");
    return a;
  }
  const loadMeta = () => { try { return readJSON(META_KEY, {}) || {}; } catch (e) { return {}; } };
  const saveMeta = m => { try { writeJSON(META_KEY, m); } catch (e) {} };

  /** One-time move of the old single sheet into today's day record. The old key is left untouched. */
  function migrateLegacy() {
    const meta = loadMeta();
    if (meta.migratedLegacy) return;
    try {
      const old = readJSON(LEGACY_KEY, null);
      const store = loadDays();
      if (old && Array.isArray(old.names) && Array.isArray(old.rows) && !Object.keys(store.days).length) {
        const now = new Date().toISOString();
        store.days[today()] = { date: today(), names: old.names, rows: old.rows, unit: old.unit || "kg",
                                notes: "", createdAt: now, updatedAt: now };
        writeJSON(DAYS_KEY, store);
      }
      meta.migratedLegacy = true; saveMeta(meta);
    } catch (e) { /* leave everything as it was; try again next launch */ }
  }

  function getDay(date) { return loadDays().days[date] || null; }
  function getArchived(date) { return loadArchive().records[date] || null; }
  function listDates() { return Object.keys(loadDays().days).sort(); }

  /** Save one day. Returns true on success, false if storage refused (full or blocked). */
  function saveDay(day) {
    try {
      const store = loadDays();
      day.updatedAt = new Date().toISOString();
      if (!day.createdAt) day.createdAt = day.updatedAt;
      store.days[day.date] = day;
      writeJSON(DAYS_KEY, store);
      return true;
    } catch (e) { return false; }
  }

  /**
   * Retention pipeline: "save before delete".
   *  1. Find active days older than the 30-day window.
   *  2. Copy them (with a checksum) into the archive and write the archive.
   *  3. Read the archive back and confirm every copy is there with a matching checksum.
   *  4. Only then remove those days from the active list.
   * If any step fails, nothing is deleted and the error is returned. Safe to run any number
   * of times: re-archiving a day just replaces its archive copy with an identical one.
   */
  function runRetention(now = today()) {
    const cutoff = cutoffDate(now);
    let store;
    try { store = loadDays(); } catch (e) { return { ok: false, archived: 0, error: "Couldn't read saved days. Nothing was deleted." }; }
    const expired = Object.keys(store.days).filter(d => d < cutoff).sort();
    const meta = loadMeta();
    meta.lastRetentionRun = new Date().toISOString();
    if (!expired.length) { saveMeta(meta); return { ok: true, archived: 0 }; }

    // Steps 2-3: archive and verify.
    try {
      const archive = loadArchive();
      const archivedAt = new Date().toISOString();
      const sums = {};
      for (const date of expired) {
        const day = store.days[date];
        sums[date] = checksum(day);
        archive.records[date] = Object.assign({}, day, { archivedAt, checksum: sums[date] });
      }
      writeJSON(ARCHIVE_KEY, archive);
      const check = loadArchive();
      for (const date of expired) {
        const rec = check.records[date];
        if (!rec || rec.checksum !== sums[date] || checksum(rec) !== sums[date]) throw new Error("verify failed for " + date);
      }
    } catch (e) {
      saveMeta(meta);
      const full = e && (e.name === "QuotaExceededError" || /quota/i.test(e.message || ""));
      return { ok: false, archived: 0, error: full
        ? "Phone storage is full, so old days couldn't be archived. Nothing was deleted. Export the archive and free some space."
        : "Archiving old days failed. Nothing was deleted; it will try again next time." };
    }

    // Step 4: delete originals, only those we just verified.
    try {
      const fresh = loadDays();
      for (const date of expired) delete fresh.days[date];
      writeJSON(DAYS_KEY, fresh);
    } catch (e) {
      // The archive already holds safe copies; the originals simply stay until the next run.
      saveMeta(meta);
      return { ok: false, archived: 0, error: "Old days were archived but couldn't be removed yet. It will retry." };
    }
    meta.lastArchived = { at: meta.lastRetentionRun, dates: expired };
    saveMeta(meta);
    return { ok: true, archived: expired.length, dates: expired };
  }

  /* ---- exports ---- */
  const sumCell = v => {
    const s = String(v ?? "").replace(/[,\s]/g, "").replace(/\+$/, "");
    if (!s) return null;
    const parts = s.split("+");
    return parts.every(p => /^-?(\d+\.?\d*|\.\d+)$/.test(p)) ? parts.reduce((t, p) => t + Number(p), 0) : null;
  };
  function archiveJSON() {
    const a = loadArchive();
    return JSON.stringify({ app: "Calculator for Farm", schema: SCHEMA, exportedAt: new Date().toISOString(),
                            records: Object.values(a.records).sort((x, y) => x.date < y.date ? -1 : 1) }, null, 2);
  }
  function archiveCSV() {
    const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = ["date,sheet,name,row,value,unit,note,archived_at"];
    const recs = Object.values(loadArchive().records).sort((x, y) => x.date < y.date ? -1 : 1);
    for (const r of recs) {
      const sheets = (r.saved || []).map(sv => Object.assign({ label: (sv.via === "new" ? "page saved " : "cleared ") + sv.savedAt }, sv)).concat([Object.assign({ label: "last" }, r)]);
      for (const sh of sheets) {
        let wrote = false;
        sh.rows.forEach((row, ri) => row.forEach((cell, ci) => {
          const v = sumCell(cell);
          if (v === null) return;
          lines.push([r.date, sh.label, sh.names[ci] || "Name " + (ci + 1), ri + 1, v, sh.unit || r.unit, sh.notes, r.archivedAt].map(q).join(","));
          wrote = true;
        }));
        if (!wrote && sh.label === "last") lines.push([r.date, sh.label, "", "", "", r.unit, r.notes, r.archivedAt].map(q).join(","));
      }
    }
    return lines.join("\n");
  }
  function archiveSummary() {
    const recs = Object.values(loadArchive().records).sort((x, y) => x.date < y.date ? 1 : -1);
    return recs.map(r => ({ date: r.date, notes: r.notes || "", unit: r.unit,
      total: r.rows.reduce((t, row) => t + row.reduce((s, c) => s + (sumCell(c) || 0), 0), 0) }));
  }

  /** Permanently remove one saved page (New page / Clear copy) from a day. */
  function deleteSavedPage(date, idx) {
    const store = loadDays();
    const day = store.days[date];
    if (!day || !day.saved || !day.saved[idx]) return false;
    day.saved.splice(idx, 1);
    day.updatedAt = new Date().toISOString();
    writeJSON(DAYS_KEY, store);
    return true;
  }
  /** Permanently remove a whole day, including its saved pages. */
  function deleteDay(date) {
    const store = loadDays();
    if (!store.days[date]) return false;
    delete store.days[date];
    writeJSON(DAYS_KEY, store);
    return true;
  }

  return { RETENTION_DAYS, deleteSavedPage, deleteDay, today, addDays, isValidDate, cutoffDate, migrateLegacy, getDay, getArchived,
           listDates, saveDay, runRetention, archiveJSON, archiveCSV, archiveSummary, loadMeta };
})();
</script>

<script>
(function () {
  const TOUCH = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const COLORS = ["#1a8fd6", "#22a35a", "#9b3fe0", "#ea6a1f", "#16968a", "#e0244f", "#5b47e0", "#c99a14", "#0e86c9", "#c2408f"];
  const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
  const fmt = n => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  /** Format a moment in Cambodia time. Falls back to a manual +7h shift if the phone lacks time-zone data. */
  function khTime(date, opts) {
    try { return new Date(date).toLocaleString([], Object.assign({ timeZone: "Asia/Phnom_Penh" }, opts)); }
    catch (e) { return new Date(new Date(date).getTime() + 7 * 3600000).toLocaleString([], Object.assign({ timeZone: "UTC" }, opts)); }
  }

  // ---- Day handling: one record per calendar date (see FarmStore above) ----
  const dateInput = document.getElementById("dayDate");
  const notice = document.getElementById("dayNotice");
  const card = document.getElementById("card");
  let currentDate = FarmStore.today();
  let readOnly = false;
  let state;
  let nameSaveTimer = null;

  /** A new, empty day. Copies the names from the closest earlier day so you don't retype them. */
  function blankDay(date) {
    const earlier = FarmStore.listDates().filter(d => d < date).pop();
    const prev = earlier && FarmStore.getDay(earlier);
    const names = prev ? prev.names.slice() : ["", "", "", "", ""];

  // ---- Press and hold a history row for 3 seconds to delete it ----
  const HOLD_MS = 3000;
  let pendingDelete = null;
  const confirmOverlay = document.getElementById("confirmOverlay");
  function attachHold(btn, onHold) {
    let timer = null, startX = 0, startY = 0, downAt = 0;
    btn.dataset.held = "";
    const cancel = () => { clearTimeout(timer); timer = null; btn.classList.remove("holding"); };
    btn.addEventListener("pointerdown", e => {
      startX = e.clientX; startY = e.clientY; btn.dataset.held = ""; downAt = Date.now();
      btn.classList.add("holding");
      timer = setTimeout(() => { timer = null; btn.classList.remove("holding"); btn.dataset.held = "1"; if (navigator.vibrate) navigator.vibrate(40); onHold(); }, HOLD_MS);
    });
    btn.addEventListener("pointermove", e => { if (timer && Math.hypot(e.clientX - startX, e.clientY - startY) > 12) cancel(); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(t => btn.addEventListener(t, cancel));
    btn.addEventListener("contextmenu", e => e.preventDefault());
    // A hold (finished or let go early) must not also open the page; only a quick tap opens it.

  // =================== Full calculator ===================
  // Tokens alternate number / operator. Numbers are kept as typed strings; × and ÷ are done before + and −.
  (function setupCalculator() {
    const TAPE_KEY = "farm-calc-history-v1";
    const OPS = { "+": "+", "-": "−", "*": "×", "/": "÷" };
    const calcEl = document.getElementById("calc");
    const display = document.getElementById("calcDisplay");
    const exprEl = document.getElementById("calcExpr");
    const tapeEl = document.getElementById("calcTape");
    const acBtn = document.getElementById("calcAC");
    let tokens = ["0"];          // e.g. ["12", "+", "3.5", "*", "2"]
    let justDone = false;        // true right after "=", so a digit starts fresh
    let tape = [];
    try { tape = JSON.parse(localStorage.getItem(TAPE_KEY)) || []; } catch (e) { tape = []; }
    const saveTape = () => { try { localStorage.setItem(TAPE_KEY, JSON.stringify(tape.slice(-100))); } catch (e) {} };

    const isOp = t => t in OPS;
    const last = () => tokens[tokens.length - 1];
    const round = n => Math.round(n * 1e10) / 1e10;
    function fmtNum(str) {
      if (str === "Error") return str;
      const neg = str.startsWith("-"); let s = neg ? str.slice(1) : str;
      let [i, d] = s.split(".");
      i = (i || "0").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return (neg ? "-" : "") + i + (d !== undefined ? "." + d : "");
    }
    const numStr = n => {
      if (!Number.isFinite(n)) return "Error";
      const r = round(n);
      return Math.abs(r) >= 1e15 ? r.toExponential(6) : String(r);
    };
    const exprText = toks => toks.map(t => isOp(t) ? OPS[t] : fmtNum(t)).join("");

    function evaluate(toks) {
      const t = toks.slice();
      if (isOp(t[t.length - 1])) t.pop();
      // × and ÷ first
      const stack = [parseFloat(t[0])];
      for (let i = 1; i < t.length; i += 2) {
        const op = t[i], v = parseFloat(t[i + 1]);
        if (op === "*") stack[stack.length - 1] *= v;
        else if (op === "/") stack[stack.length - 1] = v === 0 ? NaN : stack[stack.length - 1] / v;
        else stack.push(op === "-" ? -v : v);
      }
      return stack.reduce((a, b) => a + b, 0);
    }

    function show() {
      const cur = isOp(last()) ? tokens[tokens.length - 2] : last();
      display.textContent = fmtNum(cur);
      exprEl.textContent = tokens.length > 1 ? exprText(tokens) : "";
      acBtn.textContent = (isOp(last()) || last() === "0" || justDone) ? "AC" : "C";
      calcEl.querySelectorAll(".ck.op").forEach(b => b.classList.toggle("on", isOp(last()) && b.dataset.c === last()));
    }
    function renderTape() {
      tapeEl.innerHTML = "";
      if (!tape.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "Your calculations will appear here."; tapeEl.appendChild(li); return; }
      tape.forEach(item => {
        const li = document.createElement("li");
        const b = document.createElement("button"); b.type = "button";
        b.innerHTML = '<span class="ex"></span><span class="rs"></span>';
        b.querySelector(".ex").textContent = item.expr + "=";
        b.querySelector(".rs").textContent = fmtNum(item.result);
        b.addEventListener("click", () => { tokens = [item.result]; justDone = true; show(); });
        li.appendChild(b); tapeEl.appendChild(li);
      });
      tapeEl.scrollTop = tapeEl.scrollHeight;
    }

    function press(k) {
      if (display.textContent === "Error" && k !== "ac") { tokens = ["0"]; justDone = false; }
      if (/^[0-9]$/.test(k)) {
        if (justDone) { tokens = ["0"]; justDone = false; }
        if (isOp(last())) tokens.push(k);
        else if (last() === "0") tokens[tokens.length - 1] = k;
        else if (last() === "-0") tokens[tokens.length - 1] = "-" + k;
        else if (last().replace(/[-.]/g, "").length < 15) tokens[tokens.length - 1] += k;
      } else if (k === ".") {
        if (justDone) { tokens = ["0"]; justDone = false; }
        if (isOp(last())) tokens.push("0.");
        else if (!last().includes(".")) tokens[tokens.length - 1] += ".";
      } else if (isOp(k)) {
        justDone = false;
        if (isOp(last())) tokens[tokens.length - 1] = k;
        else tokens.push(k);
      } else if (k === "=") {
        if (tokens.length < 3) { justDone = true; show(); return; }
        const expr = exprText(isOp(last()) ? tokens.slice(0, -1) : tokens);
        const result = numStr(evaluate(tokens));
        if (result !== "Error") { tape.push({ expr, result, at: new Date().toISOString() }); saveTape(); renderTape(); }
        tokens = [result === "Error" ? "0" : result]; justDone = true;
        show(); if (result === "Error") display.textContent = "Error";
        return;
      } else if (k === "ac") {
        // C clears the number you're typing; AC clears everything.
        if (acBtn.textContent === "AC") tokens = ["0"];
        else tokens[tokens.length - 1] = "0";
        justDone = false;
      } else if (k === "back") {
        if (justDone) { justDone = false; }
        if (isOp(last())) tokens.pop();
        else {
          const s = last().slice(0, -1);
          tokens[tokens.length - 1] = (s === "" || s === "-") ? "0" : s;
        }
      } else if (k === "neg") {
        if (isOp(last())) tokens.push("-0");
        else tokens[tokens.length - 1] = last().startsWith("-") ? last().slice(1) : "-" + last();
        justDone = false;
      } else if (k === "pct") {
        if (isOp(last())) return;
        const v = parseFloat(last());
        const op = tokens[tokens.length - 2];
        // a + b%  ->  a + (a × b / 100);   a × b%  ->  a × (b / 100)
        const base = (op === "+" || op === "-") ? evaluate(tokens.slice(0, -2)) : 1;
        tokens[tokens.length - 1] = numStr(op === "+" || op === "-" ? base * v / 100 : v / 100);
        justDone = false;
      } else if (k === "clearTape") {
        if (!tape.length) return;
        tape = []; saveTape(); renderTape(); toast("Calculator history deleted");
        return;
      } else if (k === "tape") {
        calcEl.classList.toggle("hide-tape");
        return;
      } else if (k === "use") {
        const val = isOp(last()) ? tokens[tokens.length - 2] : last();
        if (readOnly) { toast("Go back to today to add numbers"); return; }
        const r = Math.min(active.r, state.rows.length - 1), c = Math.min(active.c, state.names.length - 1);
        state.rows[r][c] = val;
        save(); render();
        toast("Added " + fmtNum(val) + " to " + (state.names[c] || "Name " + (c + 1)) + " · row " + (r + 1));
        return;
      }
      show();
    }

    calcEl.querySelectorAll(".ck").forEach(b => {
      b.addEventListener("pointerdown", e => e.preventDefault());       // keep focus where it is
      b.addEventListener("click", () => press(b.dataset.c));
    });
    // Using the calculator hides the farm keypad on phones so both fit.
    // Computer keyboard: works when you're not typing in a box.
    document.addEventListener("keydown", e => {
      const tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || e.ctrlKey || e.metaKey || e.altKey) return;
      if (!calcEl.classList.contains("open") || !histOverlay.hidden || !confirmOverlay.hidden) return;
      const map = { Enter: "=", "=": "=", Backspace: "back", Escape: "ac", "%": "pct", x: "*", X: "*" };
      const k = map[e.key] || (/^[0-9.+\-*/]$/.test(e.key) ? e.key : null);
      if (!k) return;
      e.preventDefault(); press(k);
    });
    // Open / close the calculator sheet.
    const backdrop = document.getElementById("calcBackdrop");
    // The calculator takes the number keypad's place at the bottom; the page above still scrolls normally.
    const openCalc = () => {
      if (document.activeElement) document.activeElement.blur();
      pad.hidden = true;
      calcEl.classList.add("open");
      tapeEl.scrollTop = tapeEl.scrollHeight;
      fitPad();
    };
    const closeCalc = () => { calcEl.classList.remove("open"); pad.hidden = false; fitPad(); };
    // Tapping a number box in the table switches back to the number keypad.
    body.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("num") && calcEl.classList.contains("open")) closeCalc(); });
    document.getElementById("calcBtn").addEventListener("click", () => { if (calcEl.classList.contains("open")) closeCalc(); else openCalc(); }, true);
    document.getElementById("calcClose").addEventListener("click", closeCalc);
    backdrop.addEventListener("click", closeCalc);
    document.addEventListener("keydown", e => { if (e.key === "Escape" && calcEl.classList.contains("open") && histOverlay.hidden && confirmOverlay.hidden) closeCalc(); });
    renderTape(); show();
    /** Start the calculator fresh: empty history and 0 on the display. */
    function reset() { tape = []; saveTape(); tokens = ["0"]; justDone = false; renderTape(); show(); }
    window.FarmCalc = { press, reset, get tape() { return tape.slice(); }, get display() { return display.textContent; }, get expr() { return exprEl.textContent; } };
  })();

  // ---- Date picker, notes and archive panel ----
  // Small note box: saved with today's record (state.notes).
  const noteBox = document.getElementById("dayNote");
  noteBox.addEventListener("input", () => { if (readOnly) return; state.notes = noteBox.value; save(); });
  // Typing text (a name or the note) uses the phone keyboard, so hide the number keypad to show only one keyboard.
  document.addEventListener("focusin", e => {
    if (!TOUCH) return;
    const el = e.target;
    if (el.matches && el.matches("input.name, #dayNote")) closePad();
  });
  document.getElementById("todayBtn").addEventListener("click", () => { showNotice(""); loadDate(FarmStore.today()); });
  // If the app stays open past midnight, move on to the new day.
  const followToday = () => { if (currentDate !== FarmStore.today() && !readOnly) loadDate(FarmStore.today()); };

  /** Runs the 30-day archive pipeline and shows the result. Called on launch, on return to the app, and hourly. */
  function retention() {
    const res = FarmStore.runRetention();
    if (!res.ok) showNotice(res.error, true);
    updateDayMeta();
    return res;
  }

  FarmStore.migrateLegacy();
  loadDate(FarmStore.today());
  retention();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    followToday();
    const res = retention();
    if (res.archived && res.dates.includes(currentDate)) loadDate(currentDate);
  });
  setInterval(() => { followToday(); const res = retention(); if (res.archived && res.dates.includes(currentDate)) loadDate(currentDate); }, 60 * 60 * 1000);

  showTarget();
  fitPad();
})();
</script>

<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
